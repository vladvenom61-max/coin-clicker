<body>

  <h1>🪙 COIN CLICKER 🪙</h1>

  <div class="coins">
    <span id="coins">0</span> 🪙
  </div>

  <button class="click-button" id="clickButton">🪙</button>

  <div class="info">
    За клік: <b><span id="perClick">1</span> 🪙</b>
  </div>

  <div class="shop">
    <h2>🛒 МАГАЗИН</h2>

    <div class="upgrade">
      <div class="upgrade-info">
        <div class="upgrade-title">💪 Сильний клік</div>
        <div class="upgrade-level">
          Рівень: <span id="clickLevel">1</span>
        </div>
      </div>

      <button class="buy" id="clickUpgrade">
        Купити за <span id="clickCost">25</span> 🪙
      </button>
    </div>

    <div class="upgrade">
      <div class="upgrade-info">
        <div class="upgrade-title">🤖 Автоклікер</div>
        <div class="upgrade-level">
          Рівень: <span id="autoLevel">0</span>
        </div>
      </div>

      <button class="buy" id="autoUpgrade">
        Купити за <span id="autoCost">100</span> 🪙
      </button>
    </div>

    <button class="reset" id="resetButton">
      🗑️ Скинути прогрес
    </button>
  </div>

  <script>
    let coins = Number(localStorage.getItem("coins")) || 0;
    let perClick = Number(localStorage.getItem("perClick")) || 1;

    let clickLevel = Number(localStorage.getItem("clickLevel")) || 1;
    let autoLevel = Number(localStorage.getItem("autoLevel")) || 0;

    let clickCost = Number(localStorage.getItem("clickCost")) || 25;
    let autoCost = Number(localStorage.getItem("autoCost")) || 100;

    const coinsElement = document.getElementById("coins");
    const perClickElement = document.getElementById("perClick");

    const clickLevelElement = document.getElementById("clickLevel");
    const autoLevelElement = document.getElementById("autoLevel");

    const clickCostElement = document.getElementById("clickCost");
    const autoCostElement = document.getElementById("autoCost");

    const clickButton = document.getElementById("clickButton");
    const clickUpgrade = document.getElementById("clickUpgrade");
    const autoUpgrade = document.getElementById("autoUpgrade");
    const resetButton = document.getElementById("resetButton");

    function updateDisplay() {
      coinsElement.textContent = Math.floor(coins);
      perClickElement.textContent = perClick;

      clickLevelElement.textContent = clickLevel;
      autoLevelElement.textContent = autoLevel;

      clickCostElement.textContent = clickCost;
      autoCostElement.textContent = autoCost;

      clickUpgrade.disabled = coins < clickCost;
      autoUpgrade.disabled = coins < autoCost;

      localStorage.setItem("coins", coins);
      localStorage.setItem("perClick", perClick);
      localStorage.setItem("clickLevel", clickLevel);
      localStorage.setItem("autoLevel", autoLevel);
      localStorage.setItem("clickCost", clickCost);
      localStorage.setItem("autoCost", autoCost);
    }

    clickButton.addEventListener("click", function(event) {
      coins += perClick;

      createFloatingCoin(
        "+" + perClick + " 🪙",
        event.clientX,
        event.clientY
      );

      updateDisplay();
    });

    clickUpgrade.addEventListener("click", function() {
      if (coins >= clickCost) {
        coins -= clickCost;

        perClick += 1;
        clickLevel += 1;

        clickCost = Math.floor(clickCost * 1.6);

        updateDisplay();
      }
    });

    autoUpgrade.addEventListener("click", function() {
      if (coins >= autoCost) {
        coins -= autoCost;

        autoLevel += 1;

        autoCost = Math.floor(autoCost * 1.8);

        updateDisplay();
      }
    });

    resetButton.addEventListener("click", function() {
      const answer = confirm(
        "Точно хочеш скинути весь прогрес?"
      );

      if (answer) {
        coins = 0;
        perClick = 1;
        clickLevel = 1;
        autoLevel = 0;
        clickCost = 25;
        autoCost = 100;

        updateDisplay();
      }
    });

    function createFloatingCoin(text, x, y) {
      const element = document.createElement("div");

      element.className = "floating";
      element.textContent = text;

      element.style.left = x + "px";
      element.style.top = y + "px";

      document.body.appendChild(element);

      setTimeout(function() {
        element.remove();
      }, 800);
    }

    setInterval(function() {
      if (autoLevel > 0) {
        coins += autoLevel;
        updateDisplay();
      }
    }, 1000);

    updateDisplay();
  </script>

</body>
</html>
