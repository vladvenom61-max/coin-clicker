<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Clicker</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #222;
            color: white;
        }

        h1 {
            margin-top: 50px;
        }

        #coins {
            font-size: 50px;
            margin: 30px;
        }

        button {
            font-size: 25px;
            padding: 20px 40px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
        }

        #coinButton {
            background: gold;
        }
    </style>
</head>

<body>
    <h1>🪙 COIN CLICKER 🪙</h1>

    <div id="coins">0 🪙</div>

    <button id="coinButton">НАТИСНИ! 🪙</button>

    <script>
        let coins = 0;

        document.getElementById("coinButton").onclick = function() {
            coins++;
            document.getElementById("coins").textContent = coins + " 🪙";
        };
    </script>
</body>
</html>
